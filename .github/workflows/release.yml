name: Windows release

# Every push to main that changes packaging builds and tests the release zip (no release is
# made). A version tag (v1.2.3) does the same and publishes the zip as a GitHub release.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["packaging/**", ".github/workflows/release.yml", "src/emu32/__main__.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      zip: ${{ steps.zip.outputs.zip }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/emu32/__init__.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1
          fi

      - name: Install and test
        run: |
          python -m pip install ".[dev]" pyinstaller
          python -m pytest -q

      - name: Build the program folder
        run: pyinstaller --noconfirm --distpath build/dist --workpath build/work packaging/emu32.spec

      - name: Self-test the program folder
        shell: pwsh
        run: |
          $env:EMU32_HOME = "$env:RUNNER_TEMP\home-build"
          $p = Start-Process build\dist\emu32\emu32.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:EMU32_HOME\emu32.log"; exit 1 }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\emu32.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install, run and uninstall for the current user
        shell: pwsh
        run: |
          $setup = Start-Process build\installer\emu32-setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT','/CURRENTUSER','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log'
          if ($setup.ExitCode -ne 0) { Get-Content install.log; exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\emu32"
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\emu32.lnk"
          if (-not (Test-Path "$app\emu32.exe")) { "not installed in $app"; exit 1 }
          if (-not (Test-Path $menu)) { "no Start Menu entry"; exit 1 }
          $env:EMU32_HOME = "$env:RUNNER_TEMP\home-installed"
          $run = Start-Process "$app\emu32.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) { Get-Content "$env:EMU32_HOME\emu32.log"; exit 1 }
          $remove = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { "uninstall failed"; exit 1 }
          # The uninstaller deletes its own folder from a helper process; give it a moment.
          for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep 1 }
          if (Test-Path $app) { "files left in $app"; Get-ChildItem -Recurse $app; exit 1 }
          if (Test-Path $menu) { "Start Menu entry left"; exit 1 }
          "install, self-test and uninstall passed"

      - name: Assemble the release zip
        id: zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $name = "emu32-$version-windows"
          $stage = "build\stage"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item build\installer\emu32-setup.exe $stage
          Copy-Item build\dist\emu32 "$stage\portable" -Recurse
          Copy-Item packaging\portable.txt "$stage\portable"
          (Get-Content packaging\README.txt -Raw).Replace('{version}', $version) | Set-Content "$stage\README.txt" -Encoding utf8
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $stage

          # The portable folder must work from where it is unpacked, without installing.
          Copy-Item "$stage\portable" "$env:RUNNER_TEMP\portable-test" -Recurse
          $p = Start-Process "$env:RUNNER_TEMP\portable-test\emu32.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\portable-test\data\emu32.log"; exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\portable-test\data\emu32.log")) { "portable mode did not keep its data next to the program"; exit 1 }

          Compress-Archive -Path "$stage\*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "zip=$name.zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$name.zip  SHA-256 $hash"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.zip }}
          path: ${{ steps.zip.outputs.zip }}
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          cat > notes.md <<EOF
          Download **${{ steps.zip.outputs.zip }}** (not the "Source code" archives), unzip it, and run \`emu32-setup.exe\`, or run \`portable/emu32.exe\` without installing. See README.txt in the zip.

          SHA-256 of ${{ steps.zip.outputs.zip }}:
          \`${{ steps.zip.outputs.sha256 }}\`

          Changes: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v$version/CHANGELOG.md).
          EOF
          gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.zip }}" --title "emu32 $version" --notes-file notes.md

  # The zip as a student gets it, on other Windows machines: downloaded (marked as coming from
  # the internet), unpacked into a folder with spaces and accented letters, then run portable
  # and installed. For a tag, the zip comes from the public release link.
  verify:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.windows.outputs.zip }}

      - name: Download the published zip like a browser would
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $zip = "${{ needs.windows.outputs.zip }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/$zip"
          Remove-Item $zip
          Invoke-WebRequest $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "${{ needs.windows.outputs.sha256 }}") { "downloaded zip has a different SHA-256"; exit 1 }
          "downloaded $url, SHA-256 matches the release notes"

      - name: Unpack into an unusual folder
        id: unpack
        shell: pwsh
        run: |
          $zip = "${{ needs.windows.outputs.zip }}"
          # What a browser adds to a downloaded file: "this came from the internet".
          Set-Content -Path $zip -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          $folder = Join-Path $env:RUNNER_TEMP "T$([char]0xE9)l$([char]0xE9)chargements\emu32 test"
          Expand-Archive $zip -DestinationPath $folder
          foreach ($item in 'emu32-setup.exe', 'README.txt', 'LICENSE', 'THIRD_PARTY_NOTICES.md',
                            'portable\emu32.exe', 'portable\portable.txt') {
            if (-not (Test-Path (Join-Path $folder $item))) { "missing in the zip: $item"; exit 1 }
          }
          "folder=$folder" >> $env:GITHUB_OUTPUT
          "unpacked to $folder"

      - name: Run the portable folder where it was unpacked
        shell: pwsh
        run: |
          $folder = "${{ steps.unpack.outputs.folder }}"
          $p = Start-Process (Join-Path $folder 'portable\emu32.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content (Join-Path $folder 'portable\data\emu32.log'); exit 1 }
          "portable self-test passed on ${{ matrix.os }}"

      - name: Install into a folder with spaces, run, uninstall
        shell: pwsh
        run: |
          $folder = "${{ steps.unpack.outputs.folder }}"
          $target = Join-Path $env:LOCALAPPDATA "Programs\emu32 $([char]0xFC)bung"
          $setup = Start-Process (Join-Path $folder 'emu32-setup.exe') -Wait -PassThru `
            -ArgumentList '/VERYSILENT','/CURRENTUSER','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`""
          if ($setup.ExitCode -ne 0) { "setup failed"; exit 1 }
          $env:EMU32_HOME = Join-Path $env:RUNNER_TEMP 'home-verify'
          $run = Start-Process (Join-Path $target 'emu32.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) { Get-Content "$env:EMU32_HOME\emu32.log"; exit 1 }
          $remove = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          for ($i = 0; $i -lt 30 -and (Test-Path $target); $i++) { Start-Sleep 1 }
          if ($remove.ExitCode -ne 0 -or (Test-Path $target)) { "uninstall left files behind"; exit 1 }
          "install, self-test and uninstall passed on ${{ matrix.os }}"
