name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the rules check reads every commit message
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Qt needs libEGL even when rendering offscreen.
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update; sudo apt-get install -y -o Acquire::Retries=5 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_rules.py
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
