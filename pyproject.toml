[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emu32"
dynamic = ["version"]
description = "Desktop tool for learning 32-bit x86 assembly: edit, compile, and step through programs."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "hani-k07" }]
dependencies = [
    "unicorn>=2.1,<3",
    "keystone-engine>=0.9.2,<0.10",
    "capstone>=5.0,<6",
    # Only QtCore, QtGui and QtWidgets are used; the full PySide6 bundle adds
    # several hundred MB of modules this project does not need.
    "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]

[project.scripts]
emu32 = "emu32.__main__:main"

[project.urls]
Repository = "https://github.com/hani-k07/emu32"

[tool.setuptools.dynamic]
version = { attr = "emu32.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emu32 = ["examples/*.asm", "help/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unicorn's mem_map triggers an access violation that it handles itself; on Windows the
# faulthandler plugin still prints a "fatal exception" dump for it. See docs/decisions.md D7.
addopts = "-p no:faulthandler"
qt_api = "pyside6"
